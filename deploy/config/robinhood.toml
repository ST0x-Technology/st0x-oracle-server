# st0x-oracle-server runtime config for ROBINHOOD CHAIN (chain id 4663).
#
# This file is the Robinhood deployment's config in the same sense
# deploy/config/production.toml is Base's, and the repo side of that
# deployment now exists: config-check.yml validates it on every PR against
# the newest released image, and .github/workflows/robinhood-release.yml
# publishes it as a version of the oracle-runtime-config-robinhood secret
# and rolls the t0-oracle-robinhood Cloud Run service behind the same
# app-deploy PAM grant production uses. One manual dispatch, no trigger.
#
# THE GCP SIDE DOES NOT EXIST YET: the service, the secret, the DNS name
# and the pricing subscription for chain 4663 are listed as prerequisites
# in the README ("Chains" -> "GCP prerequisites"), and until they are created
# a dispatch of robinhood-release.yml fails on the first gcloud call.
# There is no staging twin; split this into robinhood-staging.toml /
# robinhood-production.toml if one is ever added and the two diverge.
#
# The registry below is the live 4663 deployment. Every address was read
# back from the chain before it was committed: `symbol()` matches its row
# and `decimals()` is 18 for all 48, and the quote token answers "USDG"
# ("Global Dollar") with 6 decimals (2026-09-11, via
# rpc.mainnet.chain.robinhood.com).
#
# TWO PROPERTIES MUST HOLD BEFORE THIS DEPLOYMENT SIGNS ANYTHING. Both
# are correctness, not polish, and both now hold in this binary:
#
#   1. The signed context must name its chain. EIP-191 signing is
#      chain-agnostic, so up to v6 a context signed for one chain verifies
#      unchanged inside an order on another wherever the two chains share
#      a token address — which ST0x tokens, deployed deterministically,
#      may well do. `/context/v7` signs the `chain_id` below at slot 9
#      (RAI-1991), and a v7 order asserts it against its own
#      `expected-chain-id` binding. Orders on this chain MUST be v7 and
#      MUST carry that assert; a v6 order here is still replayable from
#      Base.
#   2. The pricing quote cache must be keyed by (chain id, symbol).
#      st0x.pricing stamps a chain id on every frame; a symbol-keyed cache
#      would let a Base frame overwrite the Robinhood frame for the same
#      symbol and the oracle would sign whichever landed last. The cache
#      keys on the `chain_id` below (RAI-2130).
#
# Chain constants, for whoever fills this in. The server reads NONE of
# them — they are here so the deployment's facts live in one place:
#
#   RPC (archive) https://robinhood-chain.gateway.tenderly.co
#   RPC (public)  https://rpc.mainnet.chain.robinhood.com
#   IRaindexV6    0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20
#   RaindexInvent 0x1eFd85E6C384fAD9B80C6D508E9098Eb91C4eD30
#   USDG (Global Dollar, 6 dec) — THE SETTLEMENT STABLE
#                 0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168
#   Circle's native USDC is also deployed on 4663
#                 (0x3884564BA51B349e7661c7e28Ad947DEE327FeDF), and is
#                 NOT what this chain settles in. Do not "correct" the
#                 quote token to it.
#   Token-owner Safe
#                 0x3840aeDaEc8e82f79d8F6a8F6ADCa271E13E0329
#   Subgraph      TODO — the Ormi subgraph for 4663 is being set up
#                 separately. strategy/settings.yaml gets its `robinhood`
#                 network (and the Zoltu interpreter suite, identical to
#                 the other chains) once that URL exists; adding a
#                 subgraph-less network before then would only break the
#                 Raindex UI for Base.
#
# Non-secret settings only; secrets come from Secret Manager env injection.

port = 3000

# The chain this deployment serves. Two things read it: the pricing quote
# cache (only 4663 frames are served) and /context/v7, which signs it at
# slot 9 — see the two properties in the header. Set explicitly so this
# deployment can never silently inherit the 8453 default.
chain_id = 4663

# USDG (Global Dollar) — the settlement stable on Robinhood Chain,
# 6 decimals, confirmed by Robinhood 2026-09-11. The quote side of every
# pair. Not a USDC at all, which is the whole reason this key exists
# rather than a constant in main.rs; the resolver matches it by address
# and never reads its symbol.
quote_token = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"

# Live pricing source. ws_url is a placeholder here: the stack's
# PRICING_WS_URL env var overrides it with this env's Cloud Run pricing
# URL. The consumer name must match the `pricing_<consumer>_<32-hex>` API
# key format.
[pricing]
ws_url = "ws://st0x-pricing:8080/ws"
consumer = "oracle"

# --- Robinhood Chain token registry -----------------------------------------
# The wrapped tokens (wt*, 18 decimals) deployed on 4663, which is what the
# Base registry lists too — not the tNNN receipt vaults those wrap. Symbols
# are st0x.pricing asset names and are chain-independent; only the
# addresses change.
#
# Two rows, wtDNUT and wtFGI: the Robinhood launch pair, and exactly the
# two symbols st0x.pricing publishes on 4663 in production. The first
# Robinhood image ever deployed serves these two and nothing else.
#
# HISTORY. This file carried all 48 of pricing's symbols when it was
# merged (#82). On 2026-09-11 pricing published those 48 on 4663 alongside
# Base and a WebSocket fan-out bug had the Base oracle sign Robinhood's
# NAV for Base orders (ST0x-Technology/incident-11-09-26, ~$178k). The
# service was never released with the 48, and the rollout is now one
# symbol pair at a time behind a strategy-level volume cap and an
# external watchdog. The other 46 addresses are in git history.
#
# A row here for a symbol pricing does not publish on 4663 sits
# permanently in the missing-symbols count on /status and blunts the alert
# that catches a wedged feed, so add rows only as pricing adds them.
# ----------------------------------------------------------------------------

[[tokens]]
address = "0xb7fC2b7881cceeB73D8DEccf69B6AcB8aC2E0826"
symbol = "wtDNUT"

[[tokens]]
address = "0x685DFd386968B58D895F934485820C479C79a8bB"
symbol = "wtFGI"
