name: deploy

# Application releases, hub-and-spoke:
#
#   nix build .#oci → push digest → t0-artifacts (central Artifact Registry)
#     └─ deploy digest → t0-oracle-staging (this branch + main)
#
# PRODUCTION IS NOT DEPLOYED FROM THIS REPO. Prod rolls happen exclusively
# in t0.devops: promote the staging-verified digest into
# terraform/production-oracle/images.yaml — merging that fires the
# release-oracle workflow (PAM-approved apply + image roll). Versions are
# labels on top of that: the first main build after a Cargo.toml version
# bump also gets a vX.Y.Z registry tag on its digest (see the last
# build-push step), which the manifest pins alongside the digest. This repo's
# deployer SAs hold no rights in st0x-production (revoked 2026-07-24,
# t0.devops#93), so a prod-deploy job here could only 403.
#
# The image is built BY THE FLAKE (dockerTools) — no Dockerfile, no base
# image: the exact nix store closure `nix build .#st0x-oracle-server`
# produces, plus CA certs and the non-secret config. `created` is pinned in
# the flake, so a commit rebuilds to the same digest.
#
# While the RAI-1002 parity window runs, THIS STACK BRANCH deploys to
# staging via a staging-only deployer SA (can touch t0-oracle-staging and the
# registry, nothing in production). Bindings live in
# t0.devops/terraform/{production-artifacts,staging-oracle}.
#
# Auth: GitHub OIDC -> WIF, no stored keys. PRs get nothing (ci.yml gates).

on:
  push:
    branches:
      - main
      - feature/rai-1002-gcp-kms-signer
      # Current top of the RAI-1002 stack (+ the WS read-deadline fix):
      # staging-only, same staging deployer SA as the branch above.
      - fix/pricing-ws-read-deadline
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  # write: the version-tag step publishes a git tag + GitHub release when a
  # new version is minted (read covered everything else).
  contents: write
  # GitHub/Sigstore provenance attestation on every pushed digest.
  attestations: write

env:
  # Phase 5.1 cutover (t0.devops MIGRATION.md): t0-oracle-staging replaced
  # st0x-staging on 2026-07-31.
  PROJECT_STAGING: t0-oracle-staging
  REGION: europe-west3
  SERVICE: t0-oracle
  IMAGE: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle/t0-oracle-server
  # From t0.devops/terraform/production-artifacts outputs.
  WIF_PROVIDER: projects/684788085322/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  # main -> oracle-deployer; branch -> staging-only SA. Both stop at staging.
  DEPLOYER_SA: ${{ github.ref == 'refs/heads/main'
    && 'oracle-deployer@t0-artifacts.iam.gserviceaccount.com'
    || 'oracle-deployer-staging@t0-artifacts.iam.gserviceaccount.com' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-oci-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-oci-${{ runner.os }}-
          gc-max-store-size-linux: 10G

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          # `container binauthz` lives in the beta component.
          install_components: beta

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build OCI image from the flake
        run: |
          set -euo pipefail
          nix build --impure .#oci
          # streamLayeredImage output is a script that streams the tar.
          ./result | docker load
          docker tag st0x-oracle-server:latest "${IMAGE}:${GITHUB_SHA}"

      - name: Push image and resolve digest
        id: push
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "Pushed: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIGEST##*@}" >> "$GITHUB_OUTPUT"

      # Two independent provenance proofs on the digest just pushed:
      #
      # 1. GitHub/Sigstore attestation — binds the digest to THIS repo,
      #    workflow, and commit. Anyone verifies with:
      #    gh attestation verify oci://<image>@<digest> --repo ${{ github.repository }}
      #
      # 2. Binary Authorization attestation — the digest signed with the
      #    t0-artifacts attestor KMS key. staging/production only admit
      #    signed digests (policies in st0x.devops terraform/{staging,production}).
      #
      # Both run as the same WIF identity as the push, so the boundary they
      # enforce is "built by a deploying branch of this repo" — a rogue image
      # pushed straight into the registry can't be deployed. (Third, manual
      # proof: the image is a reproducible nix build — `nix build .#oci` at
      # this commit re-derives the digest byte-for-byte.)
      - name: Attest build provenance (GitHub / Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.sha256 }}

      - name: Sign Binary Authorization attestation
        run: |
          set -euo pipefail
          gcloud beta container binauthz attestations sign-and-create \
            --project="t0-artifacts" \
            --artifact-url="${{ steps.push.outputs.digest }}" \
            --attestor="projects/t0-artifacts/attestors/oracle-image" \
            --keyversion="projects/t0-artifacts/locations/${REGION}/keyRings/attestors/cryptoKeys/oracle-image-attestor/cryptoKeyVersions/1"

      # Version tag: the FIRST main build after a Cargo.toml version bump
      # gets vX.Y.Z added to its (already attested) digest. That tag is the
      # human-readable name t0.devops release manifests pin next to the
      # digest; deploys still roll the digest, and t0.devops CI fails any
      # manifest PR where tag and digest disagree. Later main builds without
      # a bump leave the tag where it is, so a version never silently moves.
      # Runs on main only: the deployer SA is impersonable from
      # refs/heads/main alone, which also enforces "versions are main
      # builds" structurally.
      - name: Tag release version (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          TAG="v${VERSION}"
          if EXISTING=$(gcloud artifacts docker images describe "${IMAGE}:${TAG}" \
              --format='value(image_summary.digest)' 2>/dev/null); then
            echo "${TAG} already points at ${EXISTING} and stays there (bump Cargo.toml to cut a new version)."
            exit 0
          fi
          gcloud artifacts docker tags add "${{ steps.push.outputs.digest }}" "${IMAGE}:${TAG}"
          echo "Tagged ${TAG} -> ${{ steps.push.outputs.digest }}"
          # Same name on the repo: a git tag + GitHub release at this commit,
          # so the releases page and the registry agree. Never fails the
          # deploy over the label (the digest is already shipped + attested).
          printf '%s\n\n%s\n' \
            "Image digest (attested): \`${{ steps.push.outputs.digest }}\`" \
            "The Artifact Registry tag \`${TAG}\` points at exactly this digest. t0.devops release manifests pin the pair (\`version:\` + digest) and CI fails if they disagree; deploys always roll the digest." \
            > /tmp/release-notes.md
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md \
            || echo "::warning::gh release create ${TAG} failed (release may already exist); registry tag is minted."

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Deploys by immutable digest, never by tag. Skips (loudly) while the
      # service doesn't exist yet — the FIRST deploy is Terraform's
      # (deploy_workload=true, oracle_container_image = a digest this
      # workflow already pushed); every deploy after that happens here.
      - name: Deploy to Cloud Run (staging)
        run: |
          set -euo pipefail
          if ! gcloud run services describe "${SERVICE}" --project "${PROJECT_STAGING}" --region "${REGION}" --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "::warning::Cloud Run service '${SERVICE}' not found in ${PROJECT_STAGING} — image pushed but not deployed." \
              "Bootstrap via st0x.devops/terraform/staging (deploy_workload=true," \
              "oracle_container_image=${{ needs.build-push.outputs.digest }})."
            exit 0
          fi
          gcloud run services update "${SERVICE}" \
            --project "${PROJECT_STAGING}" \
            --region "${REGION}" \
            --image "${{ needs.build-push.outputs.digest }}" \
            --quiet
          gcloud run services describe "${SERVICE}" --project "${PROJECT_STAGING}" --region "${REGION}" \
            --format='value(status.latestReadyRevisionName, status.url)'
