name: config-check

# PR guard for deploy/config/*.toml, parsed by the `validate` subcommand
# inside the image each file targets: the production-plane files vs the
# newest RELEASED image (highest v* label), staging.toml vs the newest
# main build. Early warning only; the release itself re-validates against
# the exact digest it deploys.
#
# robinhood.toml is a production-plane file: it rolls from a version tag
# via robinhood-release.yml, so the binary it must satisfy is the newest
# release, exactly like production.toml. Every deployed config is listed
# here — a config nothing validates is how a config gets ahead of its
# binary.

on:
  pull_request:
    paths:
      - "deploy/config/**"
      - ".github/workflows/config-check.yml"

jobs:
  validate:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/config-check.yml@986523b8a550aefc41e34ba35320da74d2e5d784 # config-check @ .github main
    with:
      production_files: deploy/config/production.toml deploy/config/robinhood.toml
      staging_files: deploy/config/staging.toml
      default_branch: main
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      image: t0-oracle-server
      service_account: oracle-labeler@t0-artifacts.iam.gserviceaccount.com
      validate_command: /bin/st0x-oracle-server validate /candidate.toml
