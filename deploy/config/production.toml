# st0x-oracle-server runtime config for PRODUCTION: the deployed source of
# truth since 2026-09-07 (moved here from t0.devops terraform/production-
# oracle/oracle-config.toml; the stack there keeps only the secret and its
# grants). A merge touching this file is a PRODUCTION CONFIG RELEASE: the
# release workflow validates it inside the exact image it deploys
# (`validate`), publishes it as a version of the oracle-runtime-config secret,
# then rolls the plane only after an approver activates the app-deploy PAM
# grant in the GCP console (.github/workflows/production-release.yml). A
# version tag ships this file together with the new binary; a
# workflow_dispatch on an older tag rolls both back. Non-secret settings only;
# secrets come from Secret Manager env injection.
#

port = 3000

# Live pricing source. ws_url is a placeholder here: the stack's
# PRICING_WS_URL env var overrides it with this env's Cloud Run pricing
# URL (see main.tf). The consumer name must match the
# `pricing_<consumer>_<32-hex>` API key format.
[pricing]
ws_url = "ws://st0x-pricing:8080/ws"
consumer = "oracle"

# Tokens come from T0's token file in the bucket (st0x.registry
# t0/production.toml): every slot on this chain with pricing = "enabled", as
# `wt<SYM>` at its tokenized_equity_derivative (src/token_file.rs).
# Boot reads the pinned `generation`, so every instance signs for the same
# tokens and a change ships only with a gated release that bumps it.
# Running instances report a newer copy on oracle_registry_pending_restart.
[registry]
url = "gs://t0-artifacts-tokens/production/tokens.toml"
generation = 1790341753647581
refresh_secs = 60
