name: release-tag

# Promote-on-tag, the org-standard release flow: pushing git tag vX.Y.Z
# labels the images the default branch CI already built and attested for
# that commit, then cuts the GitHub release. It does not build and it does
# not deploy: production is rolled by ONE manual action, Actions ->
# production-release -> Run workflow with this version, followed by the
# app-deploy PAM approval in t0-oracle (agreed with Juan on 2026-09-08 after
# RAI-2266; before that the tag itself requested the grant). The identity
# is minted by t0.devops production-artifacts (modules/ar-labeler). Only
# the values in `with:` are this repo's own.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  label:
    permissions:
      id-token: write
      # write: release-label cuts the GitHub release for the tag.
      contents: write
    uses: ST0x-Technology/.github/.github/workflows/release-label.yml@abdcdba03715f9165c8562d8060a8e4c17ab7cc8 # release-label, bump via PR
    with:
      service_account: oracle-labeler@t0-artifacts.iam.gserviceaccount.com
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      images: t0-oracle-server
      attestor: projects/t0-artifacts/attestors/oracle-image
