# st0x-oracle-server config for local runs, against the staging token file.
# Secrets (SIGNER_PRIVATE_KEY, PRICING_API_KEY) are supplied via environment
# variables; only non-secret operational settings live here. The deployed
# configs are in deploy/config/.
#
#   GCS_ACCESS_TOKEN=$(gcloud auth print-access-token) \
#     cargo run -- --config config/st0x-oracle-server.toml
#
# The server reads its tokens only from the live token file named in
# [registry], and does not start without it.

port = 3000

[pricing]
ws_url = "ws://st0x-pricing:8080/ws"
consumer = "oracle"

[registry]
url = "gs://t0-artifacts-tokens/staging/tokens.toml"
