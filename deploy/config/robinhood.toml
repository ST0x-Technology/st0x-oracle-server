# st0x-oracle-server runtime config for ROBINHOOD CHAIN (chain id 4663).
#
# NOT YET DEPLOYED. This file is the Robinhood
# deployment's config in the same sense deploy/config/production.toml is
# Base's, but no Cloud Run service reads it yet and no workflow validates
# or publishes it: .github/workflows/{config-check,deploy,production-
# release}.yml still name production.toml and staging.toml only. Wire it
# up in the same commit that creates the service, and split it into
# robinhood-staging.toml / robinhood-production.toml at that point if the
# two environments diverge.
#
# The registry below is the live 4663 deployment. Every address was read
# back from the chain before it was committed: `symbol()` matches its row
# and `decimals()` is 18 for all 39, and the quote token answers "USDG"
# ("Global Dollar") with 6 decimals (2026-09-11, via
# rpc.mainnet.chain.robinhood.com).
#
# TWO PROPERTIES MUST HOLD BEFORE THIS DEPLOYMENT SIGNS ANYTHING, and
# neither holds in this binary. Both are correctness, not polish:
#
#   1. The signed context must name its chain. EIP-191 signing is
#      chain-agnostic and no context slot carries a chain id, so a context
#      signed for one chain verifies unchanged inside an order on another
#      wherever the two chains share a token address — which ST0x tokens,
#      deployed deterministically, may well do. The `chain_id` key below
#      is what a binary that signs the chain reads; it is inert (unknown
#      keys are ignored) until then, and is set now so this deployment can
#      never silently inherit the 8453 default.
#   2. The pricing quote cache must be keyed by (chain id, symbol).
#      st0x.pricing stamps a chain id on every frame; a symbol-keyed cache
#      lets a Base frame overwrite the Robinhood frame for the same symbol
#      and the oracle signs whichever landed last.
#
# Chain constants, for whoever fills this in. The server reads NONE of
# them — they are here so the deployment's facts live in one place:
#
#   RPC (archive) https://robinhood-chain.gateway.tenderly.co
#   RPC (public)  https://rpc.mainnet.chain.robinhood.com
#   IRaindexV6    0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20
#   RaindexInvent 0x1eFd85E6C384fAD9B80C6D508E9098Eb91C4eD30
#   USDG (Global Dollar, 6 dec) — THE SETTLEMENT STABLE
#                 0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168
#   Circle's native USDC is also deployed on 4663
#                 (0x3884564BA51B349e7661c7e28Ad947DEE327FeDF), and is
#                 NOT what this chain settles in. Do not "correct" the
#                 quote token to it.
#   Token-owner Safe
#                 0x3840aeDaEc8e82f79d8F6a8F6ADCa271E13E0329
#   Subgraph      TODO — the Ormi subgraph for 4663 is being set up
#                 separately. strategy/settings.yaml gets its `robinhood`
#                 network (and the Zoltu interpreter suite, identical to
#                 the other chains) once that URL exists; adding a
#                 subgraph-less network before then would only break the
#                 Raindex UI for Base.
#
# Non-secret settings only; secrets come from Secret Manager env injection.

port = 3000

# The chain this deployment serves. Inert on a binary that does not sign a
# chain id (unknown keys are ignored) — see property 1 in the header.
chain_id = 4663

# USDG (Global Dollar) — the settlement stable on Robinhood Chain,
# 6 decimals, confirmed by Robinhood 2026-09-11. The quote side of every
# pair. Not a USDC at all, which is the whole reason this key exists
# rather than a constant in main.rs; the resolver matches it by address
# and never reads its symbol.
quote_token = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"

# Live pricing source. ws_url is a placeholder here: the stack's
# PRICING_WS_URL env var overrides it with this env's Cloud Run pricing
# URL. The consumer name must match the `pricing_<consumer>_<32-hex>` API
# key format.
[pricing]
ws_url = "ws://st0x-pricing:8080/ws"
consumer = "oracle"

# --- Robinhood Chain token registry -----------------------------------------
# The wrapped tokens (wt*, 18 decimals) deployed on 4663, which is what the
# Base registry lists too — not the tNNN receipt vaults those wrap. Symbols
# are st0x.pricing asset names and are chain-independent; only the
# addresses change.
#
# 39 rows, in the Base registry's order so the two read side by side. The
# chain has 41 wt tokens; the two this file leaves out are wtFTF and
# wtIBHG, which st0x.pricing does not publish, so they could never be
# quoted — an entry for either would only sit permanently in the
# missing-symbols count on /status and blunt the alert that catches a
# wedged feed. Add them here when pricing publishes them.
#
# Absent the other way round: wtMCD, wtNKE, wtGRND, wtDNUT, wtFGI, wtPLBY,
# wtTR and wtWEN are in the Base registry but are not deployed on 4663.
# ----------------------------------------------------------------------------

[[tokens]]
address = "0xa3947d2A74F5a3A7135A9d0c66B28fC7315f30Da"
symbol = "wtNVDA"

