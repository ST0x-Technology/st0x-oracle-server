name: config-check

# PR guard for deploy/config/*.toml, parsed by the `validate` subcommand
# inside the image each file targets: production.toml vs the newest
# RELEASED image (highest v* label), staging.toml vs the newest main
# build. Early warning only; the release itself re-validates against the
# exact digest it deploys.

on:
  pull_request:
    paths:
      - "deploy/config/**"
      - ".github/workflows/config-check.yml"

jobs:
  validate:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/config-check.yml@97500090e5c9c2d7e62226352071eeff0f2451b1 # config-check, bump via PR
    with:
      production_files: deploy/config/production.toml
      staging_files: deploy/config/staging.toml
      default_branch: main
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      image: t0-oracle-server
      service_account: oracle-labeler@t0-artifacts.iam.gserviceaccount.com
      validate_command: /bin/st0x-oracle-server validate /candidate.toml
