# st0x-oracle-server runtime config for STAGING: the deployed source of truth
# since 2026-09-07 (moved here from t0.devops terraform/staging-oracle/oracle-
# config.toml; the stack there keeps only the secret and its grants). Every
# merge to the default branch validates it with the binary just built
# (`validate`), publishes it as a version of the oracle-runtime-config secret
# and pins that version into the new revision (deploy.yml ->
# ST0x-Technology/.github app-release). No approval: staging is the fast path.
# Non-secret settings only; secrets come from Secret Manager env injection.
#

port = 3000

# Live pricing source. ws_url is a placeholder here: the stack's
# PRICING_WS_URL env var overrides it with this env's Cloud Run pricing
# URL (see main.tf). The consumer name must match the
# `pricing_<consumer>_<32-hex>` API key format.
[pricing]
ws_url = "ws://st0x-pricing:8080/ws"
consumer = "oracle"

# Tokens come from T0's token file in the bucket (st0x.registry
# t0/staging.toml): every slot on this chain with pricing = "enabled", as
# `wt<SYM>` at its tokenized_equity_derivative (src/token_file.rs).
# No `generation` pin: each new instance reads the latest copy.
# Running instances report a newer copy on oracle_registry_pending_restart.
[registry]
url = "gs://t0-artifacts-tokens/staging/tokens.toml"
refresh_secs = 60
