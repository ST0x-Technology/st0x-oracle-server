name: release-tag

# Promote-on-tag, the org-standard release flow (settled in
# st0x.liquidity#1289): pushing git tag vX.Y.Z labels the images main
# CI already built and attested for that commit, then cuts the GitHub
# release. It does not build and does not deploy. The full contract
# (refusals, idempotence, prerequisites) lives in the reusable workflow
# below; the identity is minted by t0.devops production-artifacts
# (modules/ar-labeler). Only the values in `with:` are this repo's own.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  label:
    permissions:
      id-token: write
      # write: release-label cuts the GitHub release for the tag.
      contents: write
    uses: ST0x-Technology/.github/.github/workflows/release-label.yml@abdcdba03715f9165c8562d8060a8e4c17ab7cc8 # release-label, bump via PR
    with:
      service_account: oracle-labeler@t0-artifacts.iam.gserviceaccount.com
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      images: t0-oracle-server
      attestor: projects/t0-artifacts/attestors/oracle-image

  # Production deploy of the version just labeled, behind the app-deploy PAM
  # grant in t0-oracle: the config at this tag is validated inside the
  # labeled image, published, and the service rolls once an approver
  # activates the grant in the GCP console. Rollback = production-release.yml
  # workflow_dispatch with an older version.
  deploy-production:
    needs: label
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@16aab8c5db9e2a4e70dba4b1af73d3c9336c6816 # app-release @ .github main
    with:
      environment: production
      runtime: cloud-run
      project: t0-oracle
      region: europe-west3
      service: t0-oracle
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      images: t0-oracle-server
      attestor: projects/t0-artifacts/attestors/oracle-image
      service_account: oracle-releaser@t0-artifacts.iam.gserviceaccount.com
      pam_entitlement: app-deploy
      config_file: deploy/config/production.toml
      config_secret: oracle-runtime-config
      config_mount: /config/st0x-oracle-server.toml
      validate_command: /bin/st0x-oracle-server validate /candidate.toml
