name: deploy

# Application releases, hub-and-spoke:
#
#   nix build .#oci → push digest → t0-artifacts (central Artifact Registry)
#     └─ deploy digest → t0-oracle-staging (this branch + main)
#
# PRODUCTION IS DEPLOYED FROM THIS REPO TOO, but never by this workflow:
# pushing git tag vX.Y.Z runs release-tag.yml (label the attested digest,
# cut the GitHub release, then deploy production behind a PAM grant), and
# a merge touching deploy/config/production.toml runs
# production-release.yml (config-only, same gate). Staging is this file:
# every main merge builds, attests, and hands the digest + the config at
# deploy/config/staging.toml to the shared app-release workflow
# (ST0x-Technology/.github), which validates the config with the binary
# just built, publishes it as a Secret Manager version and rolls the
# service. Since 2026-09-07 (t0.devops#465); before that production rolled
# only from a t0.devops manifest merge.
#
# All of that is the BASE (8453) plane. Robinhood Chain (4663) is a second
# deployment of this same image — its own service, its own config, its own
# runtime-config secret — rolled only by robinhood-release.yml. Neither
# this workflow nor a version tag touches it.
#
# The image is built BY THE FLAKE (dockerTools) — no Dockerfile, no base
# image: the exact nix store closure `nix build .#st0x-oracle-server`
# produces, plus CA certs and the non-secret config. `created` is pinned in
# the flake, so a commit rebuilds to the same digest.
#
# Auth: GitHub OIDC -> WIF, no stored keys. PRs get nothing (ci.yml gates).
# (The RAI-1002 staging-only branch deployer is gone: t0.devops#106.)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # GitHub/Sigstore provenance attestation on every pushed digest.
  attestations: write

env:
  # Phase 5.1 cutover (t0.devops MIGRATION.md): t0-oracle-staging replaced
  # st0x-staging on 2026-07-31.
  PROJECT_STAGING: t0-oracle-staging
  REGION: europe-west3
  SERVICE: t0-oracle
  IMAGE: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle/t0-oracle-server
  # From t0.devops/terraform/production-artifacts outputs.
  WIF_PROVIDER: projects/684788085322/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  # Pushes + attests images, rolls staging. Production is oracle-releaser
  # (release-tag.yml / production-release.yml), behind PAM.
  DEPLOYER_SA: oracle-deployer@t0-artifacts.iam.gserviceaccount.com

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-oci-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-oci-${{ runner.os }}-
          gc-max-store-size-linux: 10G

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          # `container binauthz` lives in the beta component.
          install_components: beta

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build OCI image from the flake
        run: |
          set -euo pipefail
          nix build --impure .#oci
          # streamLayeredImage output is a script that streams the tar.
          ./result | docker load
          docker tag st0x-oracle-server:latest "${IMAGE}:${GITHUB_SHA}"

      - name: Push image and resolve digest
        id: push
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "Pushed: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIGEST##*@}" >> "$GITHUB_OUTPUT"

      # Two independent provenance proofs on the digest just pushed:
      #
      # 1. GitHub/Sigstore attestation — binds the digest to THIS repo,
      #    workflow, and commit. Anyone verifies with:
      #    gh attestation verify oci://<image>@<digest> --repo ${{ github.repository }}
      #
      # 2. Binary Authorization attestation — the digest signed with the
      #    t0-artifacts attestor KMS key. staging/production only admit
      #    signed digests (policies in st0x.devops terraform/{staging,production}).
      #
      # Both run as the same WIF identity as the push, so the boundary they
      # enforce is "built by a deploying branch of this repo" — a rogue image
      # pushed straight into the registry can't be deployed. (Third, manual
      # proof: the image is a reproducible nix build — `nix build .#oci` at
      # this commit re-derives the digest byte-for-byte.)
      - name: Attest build provenance (GitHub / Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.sha256 }}

      - name: Sign Binary Authorization attestation
        run: |
          set -euo pipefail
          gcloud beta container binauthz attestations sign-and-create \
            --project="t0-artifacts" \
            --artifact-url="${{ steps.push.outputs.digest }}" \
            --attestor="projects/t0-artifacts/attestors/oracle-image" \
            --keyversion="projects/t0-artifacts/locations/${REGION}/keyRings/attestors/cryptoKeys/oracle-image-attestor/cryptoKeyVersions/1"

  # Staging rolls on every main merge: the shared app-release workflow
  # validates deploy/config/staging.toml inside the image just built,
  # publishes it as a version of oracle-runtime-config, and updates the
  # service with the digest + that version pinned. No approval (staging).
  deploy-staging:
    needs: build-push
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@986523b8a550aefc41e34ba35320da74d2e5d784 # app-release @ .github main
    with:
      environment: staging
      runtime: cloud-run
      project: t0-oracle-staging
      region: europe-west3
      service: t0-oracle
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      images: t0-oracle-server
      attestor: projects/t0-artifacts/attestors/oracle-image
      service_account: oracle-deployer@t0-artifacts.iam.gserviceaccount.com
      image_tag: ${{ github.sha }}
      config_file: deploy/config/staging.toml
      config_secret: oracle-runtime-config
      config_mount: /config/st0x-oracle-server.toml
      validate_command: /bin/st0x-oracle-server validate /candidate.toml
