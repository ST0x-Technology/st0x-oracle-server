name: production-release

# THE production release for this repo, and the only way to roll it. One
# manual action plus the app-deploy PAM approval in t0-oracle:
#   Actions -> production-release -> Run workflow
#     version = vX.Y.Z  : image AND deploy/config/production.toml from that tag
#                         (new version, re-deploy or rollback);
#     version empty     : CONFIG-ONLY release, deploy/config/production.toml
#                         from the default branch on the digest LIVE in
#                         production.
# Nothing fires on its own any more (until 2026-09-08 a merge touching the
# production config requested a grant by itself, and release-tag.yml did
# the same for every tag; RAI-2266). Either way the file is validated
# inside the exact image it will run on before the grant is requested,
# published as a runtime-config version, and a new revision rolls with
# that version pinned once an approver activates the grant.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "vX.Y.Z to deploy image and config from that tag; leave empty for a config-only release of deploy/config/production.toml from the default branch onto the live image"
        required: false
        default: ""
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@986523b8a550aefc41e34ba35320da74d2e5d784 # app-release @ .github main
    with:
      environment: production
      runtime: cloud-run
      project: t0-oracle
      region: europe-west3
      service: t0-oracle
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      images: t0-oracle-server
      attestor: projects/t0-artifacts/attestors/oracle-image
      service_account: oracle-releaser@t0-artifacts.iam.gserviceaccount.com
      pam_entitlement: app-deploy
      image_tag: ${{ inputs.version || '' }}
      ref: ${{ inputs.version || '' }}
      config_file: deploy/config/production.toml
      config_secret: oracle-runtime-config
      config_mount: /config/st0x-oracle-server.toml
      validate_command: /bin/st0x-oracle-server validate /candidate.toml
