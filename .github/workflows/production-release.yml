name: production-release

# Production releases that are NOT a new version tag (those are
# release-tag.yml):
#   - a merge to main touching deploy/config/production.toml is a
#     CONFIG-ONLY release: the file is validated inside the digest LIVE in
#     production, published as a new oracle-runtime-config version, and the
#     service re-rolls on the same digest;
#   - workflow_dispatch with a version is a ROLLBACK (or re-deploy): image
#     and config both come from that tag.
# Both block on the app-deploy PAM grant in t0-oracle, approved in the GCP
# console; the justification names the digest and config version swap.

on:
  push:
    branches:
      - main
    paths:
      - deploy/config/production.toml
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (vX.Y.Z), image and config both from that tag"
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@0f8aab4184974e7b6bd79b8e020b3ef62f884fdc # app-release, bump via PR
    with:
      environment: production
      runtime: cloud-run
      project: t0-oracle
      region: europe-west3
      service: t0-oracle
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
      images: t0-oracle-server
      attestor: projects/t0-artifacts/attestors/oracle-image
      service_account: oracle-releaser@t0-artifacts.iam.gserviceaccount.com
      pam_entitlement: app-deploy
      image_tag: ${{ inputs.version || '' }}
      ref: ${{ inputs.version || '' }}
      config_file: deploy/config/production.toml
      config_secret: oracle-runtime-config
      config_mount: /config/st0x-oracle-server.toml
      validate_command: /bin/st0x-oracle-server validate /candidate.toml
